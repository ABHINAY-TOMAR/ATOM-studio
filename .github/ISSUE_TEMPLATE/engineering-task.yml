name: Engineering task
description: Propose a concrete engineering or repository-infrastructure task
title: "chore: "
labels: [maintenance]
body:
  - type: textarea
    id: objective
    attributes:
      label: Objective
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Technical scope and requirements
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: Constraints and out-of-scope items
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      placeholder: |-
        - [ ] ...
        - [ ] ...
    validations:
      required: true
  - type: textarea
    id: testing
    attributes:
      label: Testing and verification
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies and risks
    validations:
      required: false
